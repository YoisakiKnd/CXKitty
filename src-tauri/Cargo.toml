[package]
name = "cxkitty-tauri"
version = "0.1.0"
description = "Chaoxing tooling rewrite (CXKitty + worklist) with Tauri 2 + Svelte"
authors = ["Kanade Yoisaki"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "cxkitty_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "deflate", "rustls-tls"] }
reqwest_cookie_store = "0.8"
cookie_store = "0.21"
url = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
scraper = "0.23"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
rand = "0.8"
parking_lot = "0.12"
regex = "1"
md-5 = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
