[project]
name = "CxKitty"
version = "0.4.5"
description = "超星学习通答题姬. 媒体播放、章节测验、课程考试, 集成式自动化工具"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "GPL-3.0" }
authors = [
    { name = "SocialSisterYi", email = "1440239038@qq.com" },
]
dependencies = [
    "requests>=2.28.1,<3",
    "qrcode>=7.3.1,<9",
    "rich>=12.6.0,<15",
    "pycryptodome>=3.15.0,<4",
    "lxml>=4.9.1,<7",
    "pyyaml>=6.0,<7",
    "jsonpath-python>=1.0.6,<2",
    "beautifulsoup4>=4.11.1,<5",
    "nicegui>=2.16.0,<3",
    "ddddocr>=1.4.10,<2",
    "onnxruntime>=1.18.1,<1.20",
    "numpy>=1.24.3,<2",
    "opencv-python>=4.7.0.72,<5",
    "dataclasses-json>=0.5.7,<0.7",
    "yarl>=1.9.2,<2",
]

[project.urls]
Repository = "https://github.com/YoisakiKnd/CXKitty"

[dependency-groups]
dev = [
    "black>=22.12.0,<23",
    "isort>=5.12.0,<6",
    "pyinstaller>=6.0.0,<7",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.black]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "app.py",
    "config.py",
    "logger.py",
    "utils.py",
    "cxapi",
    "resolver",
    "webapp",
]

[tool.hatch.build.targets.sdist]
include = [
    "/app.py",
    "/config.py",
    "/logger.py",
    "/utils.py",
    "/config.yml",
    "/README.md",
    "/requirements.txt",
    "/cxapi",
    "/resolver",
    "/webapp",
]
